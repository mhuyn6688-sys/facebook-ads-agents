name: Check Facebook Ads hourly
on:
  schedule:
    - cron: '0 * * * *'
    # 00:10 Asia/Ho_Chi_Minh: report the completed previous day.
    - cron: '10 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-facebook-ads
  cancel-in-progress: false
jobs:
  check-ads:
    if: github.event_name != 'schedule' || github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check campaigns and notify Telegram
        env:
          AGENT_SECRET_KEY: ${{ secrets.AGENT_SECRET_KEY }}
        run: |
          args=()
          if [ -n "$AGENT_SECRET_KEY" ]; then
            args+=(-H "Authorization: Bearer $AGENT_SECRET_KEY")
          fi
          curl --fail-with-body --silent --show-error --max-time 240 \
            "${args[@]}" \
            'https://facebook-ads-agents.vercel.app/api/check-ads' \
            --output result.json
          cat result.json
          python3 - <<'PY'
          import json
          with open("result.json") as f:
              result = json.load(f)
          if result.get("status") != "success" or result.get("telegram", {}).get("error"):
              raise SystemExit("Facebook check or Telegram delivery failed")
          PY

  daily-report:
    if: github.event_name == 'schedule' && github.event.schedule == '10 17 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send completed-day account report
        env:
          AGENT_SECRET_KEY: ${{ secrets.AGENT_SECRET_KEY }}
        run: |
          args=()
          if [ -n "$AGENT_SECRET_KEY" ]; then
            args+=(-H "Authorization: Bearer $AGENT_SECRET_KEY")
          fi
          curl --fail-with-body --silent --show-error --max-time 240 \
            "${args[@]}" \
            'https://facebook-ads-agents.vercel.app/api/check-ads?report=daily'
